# Blueprint do Render: cria o site (Web Service Node.js) e o banco PostgreSQL de uma vez.
# No Render: New + > Blueprint > escolha este repositório.
services:
  - type: web
    name: jogae
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jogae-db
          property: connectionString

databases:
  - name: jogae-db
    plan: free
    databaseName: jogae
    user: jogae
