services:
  - type: web
    name: quiz-livre
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/games
    envVars:
      # O Render vai pedir o valor na criação (não fica no GitHub).
      - key: ADMIN_PASSWORD
        sync: false
      # Se você contratar um Disco Persistente, monte-o em /var/data e descomente:
      # - key: DATA_DIR
      #   value: /var/data
